<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图片增强处理器 - 仿射变换全功能版</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>图片增强处理器 (仿射变换)</h2>

    <div class="controls">
      <p style="margin-top: 0; color: #666">
        基于 3x3 矩阵运算，支持旋转、翻转及缩放调整。
      </p>
      <div class="file-input-wrapper">
        <button class="btn-upload">选择图片上传</button>
        <input type="file" id="fileInput" accept="image/*" />
      </div>

      <div style="margin-top: 8px;">
        <button class="btn-action btn-camera" id="startCameraBtn">📷 开启摄像头</button>
      </div>

      <div class="camera-panel" id="cameraPanel">
        <div class="btn-group" style="margin-top: 10px; border-top: none; padding-top: 0;">
          <button class="btn-action btn-camera" id="captureBtn">拍照使用</button>
          <button class="btn-action" id="stopCameraBtn">关闭摄像头</button>
        </div>
        <p class="camera-tip" id="cameraTip">请允许浏览器访问摄像头。</p>
      </div>

      <div class="btn-group" id="actionGroup" style="display: none;">
        <button class="btn-action" onclick="transform('rotate', -90)">↺ 左转 90°</button>
        <button class="btn-action" onclick="transform('rotate', 90)">↻ 右转 90°</button>
        <button class="btn-action" onclick="transform('flip', 'H')">↔ 水平翻转</button>
        <button class="btn-action" onclick="transform('flip', 'V')">↕ 垂直翻转</button>
        <button class="btn-action" onclick="transform('zoom', 1.2)">➕ 放大</button>
        <button class="btn-action" onclick="transform('zoom', 0.8)">➖ 缩小</button>
        <button class="btn-action" onclick="resetTransform()">🔄 重置</button>
        <button class="btn-action btn-download" onclick="downloadImage()">💾 下载 PNG</button>
      </div>
    </div>

    <div class="result-container">
      <div class="image-box" id="originalBox">
        <h3>原图参考</h3>
        <img id="originalPreview" class="preview-image" alt="原图预览" />
        <video id="originalCameraPreview" class="preview-image" autoplay playsinline muted style="display: none;"></video>
      </div>

      <div class="image-box" id="rotatedBox">
        <h3>处理预览</h3>
        <img id="rotatedPreview" class="preview-image" alt="处理后预览" />
        <video id="rotatedCameraPreview" class="preview-image" autoplay playsinline muted style="display: none;"></video>
      </div>
    </div>

    <canvas id="hiddenCanvas"></canvas>

    <script src="script.js"></script>
  </body>
</html>
